version: 2

models:
  - name: dm_zone_kpi_daily
    description: >
      KPI journalier par arrondissement parisien : qualité de l'air, trafic
      routier et trafic vélo (compteurs), pour comparer les zones entre elles.
      Alimente la carte choroplèthe du dashboard Streamlit.
    columns:
      - name: arrondissement_code
        description: "Numéro d'arrondissement (1-20)"
        tests: [not_null]
      - name: nom_arrondissement
        tests: [not_null]
      - name: date_jour
        tests: [not_null]
      - name: no2_moyen
        description: "Concentration moyenne NO2 (µg/m³) sur les stations de la zone"
      - name: pm10_moyen
      - name: pm25_moyen
      - name: pollution_indice_moyen
        description: "Concentration moyenne tous polluants confondus, indice global de la zone"
      - name: debit_routier_moyen
      - name: taux_occupation_moyen
      - name: total_heures_bloque
      - name: total_velos
        description: "Total des passages vélo (compteurs trafic) enregistrés dans la zone ce jour"
      - name: nb_compteurs_actifs
      - name: ratio_mobilite_verte
        description: >
          Part du vélo dans le total vélo + débit routier moyen (0-1).
          Proxy de mobilité douce — n'inclut pas l'usage Vélib réel (DynamoDB,
          hors Snowflake).
      - name: updated_at
        tests: [not_null]

    tests:
      - unique:
          column_name: "(arrondissement_code || '|' || date_jour)"
