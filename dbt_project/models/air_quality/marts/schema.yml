version: 2

models:
  - name: dm_air_quality_daily
    description: "Agrégats journaliers de qualité de l'air par station et polluant, filtrés sur l'Île-de-France."
    columns:
      - name: code_site
        description: "Identifiant unique de la station de mesure"
        tests: [not_null]
      - name: nom_site
        description: "Nom de la station de mesure"
        tests: [not_null]
      - name: type_implantation
        description: "Type d'environnement du capteur (Urbaine, Trafic, Industrielle...)"
      - name: polluant
        description: "Polluant mesuré (NO2, PM10, PM2.5, O3, SO2, CO, C6H6)"
        tests:
          - not_null
          - accepted_values:
              values: ['NO2', 'PM10', 'PM2.5', 'O3', 'SO2', 'CO', 'C6H6']
      - name: unite_mesure
        description: "Unité de la mesure (µg/m3, mg/m3...)"
        tests: [not_null]
      - name: date_mesure
        description: "Date de la journée de mesure (agrégat journalier)"
        tests: [not_null]
      - name: latitude
        description: "Latitude WGS84 de la station"
        tests: [not_null]
      - name: longitude
        description: "Longitude WGS84 de la station"
        tests: [not_null]
      - name: valeur_moyenne
        description: "Concentration moyenne journalière du polluant"
        tests: [not_null]
      - name: valeur_max
        description: "Concentration maximale journalière du polluant"
        tests: [not_null]
      - name: valeur_min
        description: "Concentration minimale journalière du polluant"
      - name: nb_mesures
        description: "Nombre de mesures horaires agrégées dans la journée"
        tests: [not_null]
      - name: taux_saisie_moyen
        description: "Taux de saisie moyen des mesures sur la journée (0-100%)"
      - name: updated_at
        description: "Timestamp de la dernière mise à jour du record par dbt"
        tests: [not_null]

  - name: dm_alertes_pollution
    description: "Dépassements de seuils réglementaires OMS par station et par jour."
    columns:
      - name: code_site
        description: "Identifiant de la station ayant déclenché l'alerte"
        tests: [not_null]
      - name: nom_site
        description: "Nom de la station"
        tests: [not_null]
      - name: polluant
        description: "Polluant ayant dépassé le seuil"
        tests: [not_null]
      - name: date_mesure
        description: "Date du dépassement"
        tests: [not_null]
      - name: valeur_max_journaliere
        description: "Valeur maximale journalière ayant déclenché le dépassement"
        tests: [not_null]
      - name: valeur_moyenne
        description: "Concentration moyenne journalière du polluant"
      - name: unite_mesure
        description: "Unité de la mesure"
        tests: [not_null]
      - name: seuil_reglementaire
        description: "Valeur seuil OMS ou réglementaire dépassée"
        tests: [not_null]
      - name: type_seuil
        description: "Libellé du type de seuil (OMS annuel, OMS journalier, OMS horaire...)"
        tests: [not_null]
      - name: ratio_depassement
        description: "Ratio valeur_max / seuil (> 1 = dépassement). Ex: 1.5 = dépassement de 50%"
        tests: [not_null]
      - name: latitude
        description: "Latitude WGS84 de la station"
      - name: longitude
        description: "Longitude WGS84 de la station"
      - name: updated_at
        description: "Timestamp de la dernière mise à jour du record"
        tests: [not_null]

  - name: dm_stations
    description: "Référentiel des stations de mesure Île-de-France avec coordonnées GPS."
    columns:
      - name: code_site
        description: "Identifiant unique de la station (clé primaire)"
        tests: [not_null, unique]
      - name: nom_site
        description: "Nom de la station de mesure"
        tests: [not_null]
      - name: type_implantation
        description: "Type d'environnement (Urbaine, Périurbaine, Trafic, Industrielle)"
      - name: latitude
        description: "Latitude WGS84 de la station"
        tests: [not_null]
      - name: longitude
        description: "Longitude WGS84 de la station"
        tests: [not_null]
      - name: updated_at
        description: "Timestamp de la dernière mise à jour du référentiel"
        tests: [not_null]
