version: 2

models:

  - name: dm_smartcity_kpi_daily
    description: >
      KPI Smart City journalier : croisement multi-domaine de la qualité de l'air,
      du trafic routier et du trafic vélo pour Paris Île-de-France.
      Alimente les tableaux de bord décisionnels (BC02 – analytique multi-source).
      Chaque ligne représente un jour distinct. Modèle incrémental basé sur date_jour.
    columns:
      - name: date_jour
        description: Date du résumé journalier (YYYY-MM-DD). Clé primaire du modèle.
        tests:
          - not_null
          - unique
      - name: no2_moyen
        description: >
          Concentration moyenne de dioxyde d'azote (NO2) sur toutes les stations
          IDF pour ce jour, exprimée en µg/m³.
      - name: pm10_moyen
        description: >
          Concentration moyenne de particules fines PM10 sur toutes les stations
          IDF pour ce jour, exprimée en µg/m³.
      - name: pm25_moyen
        description: >
          Concentration moyenne de particules très fines PM2.5 sur toutes les
          stations IDF pour ce jour, exprimée en µg/m³.
      - name: o3_moyen
        description: >
          Concentration moyenne d'ozone (O3) sur toutes les stations IDF
          pour ce jour, exprimée en µg/m³.
      - name: nb_stations_alerte
        description: >
          Nombre distinct de stations de mesure ayant déclenché au moins une
          alerte pollution OMS dans la journée (dépassement d'un seuil réglementaire).
      - name: debit_routier_moyen
        description: >
          Débit routier horaire moyen (véhicules/heure) agrégé sur l'ensemble
          des arcs de voirie parisiens instrumentés.
      - name: taux_occupation_moyen
        description: >
          Taux d'occupation moyen de la voirie (%) agrégé sur tous les arcs,
          indicateur de fluidité du trafic routier.
      - name: total_heures_bloque
        description: >
          Somme des heures en situation de blocage total sur l'ensemble des
          arcs surveillés (taux_occupation > 100%).
      - name: nb_arcs_surveilles
        description: >
          Nombre d'arcs de voirie distincts ayant transmis au moins une mesure
          dans la journée.
      - name: total_velos
        description: >
          Nombre total de passages vélo enregistrés par l'ensemble des compteurs
          actifs dans la journée.
      - name: nb_compteurs_actifs
        description: >
          Nombre de compteurs vélo ayant transmis au moins une mesure dans
          la journée.
      - name: updated_at
        description: Horodatage de la dernière insertion ou mise à jour de la ligne.
        tests:
          - not_null
