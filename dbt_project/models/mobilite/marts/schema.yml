version: 2

models:

  - name: dm_velo_daily
    description: >
      Trafic vélo journalier agrégé par compteur de passage.
      Source : BRONZE.MOBILITE.RAW_TRAFIC_VELO via stg_trafic_velo et int_velo_daily.
      Alimenté par l'API opendata.paris.fr (compteurs Eco-Compteur Paris).
    columns:
      - name: compteur_id
        description: Identifiant unique du compteur de passages vélo.
        tests:
          - not_null
      - name: compteur_nom
        description: Libellé descriptif du compteur (ex. "Totem 73 boulevard de Sébastopol S-N").
        tests:
          - not_null
      - name: nom_site
        description: Nom du site ou de la voie de mesure.
      - name: date_jour
        description: Date d'agrégation (YYYY-MM-DD).
        tests:
          - not_null
      - name: total_passages_jour
        description: Nombre total de passages vélo sur la journée.
        tests:
          - not_null
      - name: nb_mesures_horaires
        description: Nombre de créneaux horaires disposant d'au moins une mesure.
      - name: pic_horaire
        description: Nombre maximum de passages enregistré sur une heure dans la journée.
      - name: latitude
        description: Latitude WGS84 du capteur.
      - name: longitude
        description: Longitude WGS84 du capteur.
      - name: updated_at
        description: Horodatage de la dernière mise à jour de la ligne dans le data warehouse.
        tests:
          - not_null

    tests:
      - unique:
          column_name: "(compteur_id || '|' || date_jour)"


  - name: dm_trafic_routier_daily
    description: >
      Trafic routier journalier agrégé par arc de voirie parisien.
      Source : BRONZE.MOBILITE.RAW_TRAFIC_ROUTIER via stg_trafic_routier et int_trafic_daily.
      Alimenté par l'API opendata.paris.fr (capteurs Siredo).
    columns:
      - name: arc_id
        description: Identifiant de l'arc de voirie (tronçon de rue instrumenté).
        tests:
          - not_null
      - name: libelle_arc
        description: Nom lisible de l'arc (ex. "RN 1 - Porte de la Chapelle").
      - name: date_jour
        description: Date d'agrégation (YYYY-MM-DD).
        tests:
          - not_null
      - name: debit_moyen
        description: Débit horaire moyen sur la journée (véhicules/heure).
      - name: debit_max
        description: Débit horaire maximum observé dans la journée.
      - name: taux_occupation_moyen
        description: Taux d'occupation moyen de la voirie (pourcentage, 0-100).
      - name: nb_heures_bloque
        description: Nombre d'heures en situation de blocage (taux_occupation > 100%).
      - name: nb_heures_sature
        description: Nombre d'heures en situation de saturation (taux_occupation 75-100%).
      - name: nb_heures_dense
        description: Nombre d'heures en trafic dense (taux_occupation 50-75%).
      - name: nb_heures_fluide
        description: Nombre d'heures en trafic fluide (taux_occupation < 50%).
      - name: nb_mesures
        description: Nombre total de mesures horaires disponibles pour l'arc ce jour-là.
      - name: latitude
        description: Latitude WGS84 du point représentatif de l'arc.
      - name: longitude
        description: Longitude WGS84 du point représentatif de l'arc.
      - name: updated_at
        description: Horodatage de la dernière mise à jour de la ligne dans le data warehouse.
        tests:
          - not_null

    tests:
      - unique:
          column_name: "(arc_id || '|' || date_jour)"


  - name: dm_stations_velib
    description: >
      Référentiel des stations Vélib' enrichi avec les indicateurs de disponibilité
      moyens journaliers (vélos et places libres).
      Source : BRONZE.MOBILITE.RAW_STATIONS_VELIB (référentiel) + RAW_VELIB_REALTIME (temps réel
      exporté quotidiennement depuis DynamoDB via S3 → Snowpipe).
    columns:
      - name: stationcode
        description: Code unique de la station Vélib' (ex. "16107").
        tests:
          - not_null
      - name: nom_station
        description: Nom lisible de la station (ex. "Benjamin Godard - Victor Hugo").
        tests:
          - not_null
      - name: capacite
        description: Nombre total de points d'attache de la station.
      - name: latitude
        description: Latitude WGS84 de la station.
      - name: longitude
        description: Longitude WGS84 de la station.
      - name: nom_arrondissement_communes
        description: Nom de l'arrondissement ou de la commune d'implantation.
      - name: code_insee_commune
        description: Code INSEE de la commune (ex. "75116" pour Paris 16e).
      - name: date_jour
        description: Date d'agrégation des relevés temps réel (YYYY-MM-DD).
        tests:
          - not_null
      - name: velos_dispo_moyen
        description: Nombre moyen de vélos disponibles sur l'ensemble des relevés de la journée.
      - name: places_dispo_moyen
        description: Nombre moyen de places libres sur l'ensemble des relevés de la journée.
      - name: velos_meca_moyen
        description: Nombre moyen de vélos mécaniques disponibles.
      - name: velos_elec_moyen
        description: Nombre moyen de vélos électriques disponibles.
      - name: nb_releves
        description: Nombre de relevés temps réel agrégés pour ce jour.
      - name: updated_at
        description: Horodatage de la dernière mise à jour de la ligne dans le data warehouse.
        tests:
          - not_null

    tests:
      - unique:
          column_name: "(stationcode || '|' || date_jour)"
